name: daily-prices
on:
  schedule: [{ cron: '0 21 * * *' }]   # 毎日 06:00 JST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-prices.mjs
        env:
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          SITE_REFERER: ${{ secrets.SITE_REFERER }}
      - run: node scripts/merge-manual.mjs
      - name: Commit data
        run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "prices $(date -u +%F)" && git push)
