name: cardlist
on:
  workflow_dispatch:
  schedule: [{ cron: '30 20 * * 1' }]   # 毎週火曜 05:30 JST(新弾・追加カードの反映)
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/fetch-cardlist.mjs
      - run: node scripts/build-sets.mjs
      - name: Commit data
        run: |
          git config user.name "price-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/raw sets cards.json
          git diff --cached --quiet || (git commit -m "cardlist $(date -u +%F)" && git pull --rebase && git push)
