<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OP17 世界最強の戦士 BOX開封ガチャ</title>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0b0710;--ink:#fbf6ee;--mute:#b9aec4;--line:#3a2b45;--gold:#ffcf4a;--gold2:#ff9d2e;--red:#e8352b;--win:#4dffa6;--lose:#7e90b8;--panel:#1a1220;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0710}}
:root[data-theme="dark"]{--bg:#0b0710}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",sans-serif;line-height:1.5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:rgba(14,9,20,.92)}
.dg{font-family:"Dela Gothic One","Zen Kaku Gothic New",sans-serif;font-weight:400}
button{font:inherit;cursor:pointer;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
#bg{position:fixed;inset:-50%;z-index:-1;background:repeating-conic-gradient(from 0deg,rgba(255,190,80,.05) 0 6deg,transparent 6deg 18deg),radial-gradient(circle at 50% 50%,#3a1030 0,#160a1c 40%,#0b0710 70%);animation:spin 80s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* ステージ */
#stage{min-height:100svh;display:grid;place-items:center;padding:24px 16px;text-align:center;position:relative;overflow:hidden}
.ttl{margin:0;font-size:clamp(46px,13vw,84px);line-height:1;color:var(--gold);text-shadow:0 4px 0 #8a2a0a,0 0 40px rgba(255,190,60,.55);letter-spacing:.02em}
.sub{margin:6px 0 0;font-size:clamp(18px,5vw,26px);text-shadow:0 2px 0 #000}
.scene{position:relative;perspective:900px;height:min(48svh,340px);display:grid;place-items:center;margin:14px 0 4px}
.scene::after{content:"";position:absolute;bottom:2%;width:160px;height:20px;border-radius:50%;background:rgba(0,0,0,.6);filter:blur(8px);animation:sh 4s ease-in-out infinite}
@keyframes sh{50%{transform:scale(.75);opacity:.55}}
.box{position:relative;z-index:2;width:min(54vw,220px);aspect-ratio:3/4;border:0;border-radius:12px;color:#fff;
background:linear-gradient(160deg,#c3263a,#6d0f22 60%,#3a0714);box-shadow:inset 0 0 0 4px var(--gold),inset 0 0 0 7px #6d0f22,inset 0 0 0 9px var(--gold),0 0 80px 14px rgba(255,170,60,.45),0 30px 60px rgba(0,0,0,.7);
display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px;animation:fl 4s ease-in-out infinite;overflow:hidden}
.box::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 35%,rgba(255,255,255,.28) 50%,transparent 65%);animation:gl 2.6s linear infinite}
@keyframes gl{from{transform:translateX(-110%)}to{transform:translateX(110%)}}
.box b{font-size:clamp(44px,12vw,58px);color:var(--gold);text-shadow:0 3px 0 #3a0714}
.box span{font-size:14px;letter-spacing:.3em}
.box img{position:absolute;inset:9px;width:calc(100% - 18px);height:calc(100% - 18px);object-fit:cover;border-radius:6px;background:#fff}
.box.has-img b,.box.has-img span{display:none}
@keyframes fl{0%,100%{transform:translateY(0) rotateY(-16deg) rotateX(4deg)}50%{transform:translateY(-22px) rotateY(16deg) rotateX(-2deg)}}
.box.shake{animation:sk .9s linear forwards}
@keyframes sk{0%{transform:translate(0)}10%{transform:translate(-6px,2px) rotate(-3deg)}20%{transform:translate(6px,-2px) rotate(3deg)}30%{transform:translate(-8px,3px) rotate(-4deg)}40%{transform:translate(8px,-3px) rotate(4deg)}50%{transform:translate(-10px,2px) rotate(-5deg) scale(1.05)}60%{transform:translate(10px,-2px) rotate(5deg) scale(1.08)}80%{transform:translate(-6px) rotate(-3deg) scale(1.12)}100%{transform:scale(1.18)}}
.bc{position:absolute;left:50%;top:50%;width:46px;height:64px;margin:-32px 0 0 -23px;border-radius:5px;border:2px solid var(--gold);background:repeating-conic-gradient(#b0182b 0 10deg,#7a0e1e 10deg 20deg);z-index:3;opacity:0}
.tap{margin:0;font-size:clamp(22px,6vw,30px);color:var(--gold);animation:pu 1.1s ease-in-out infinite}
@keyframes pu{50%{opacity:.35;transform:scale(.95)}}
.foot{margin:16px 0 0;font-size:12px;color:var(--mute)}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
/* 結果 */
#result{max-width:980px;margin:0 auto;padding:0 12px 64px;position:relative}
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin:0 -12px;padding:12px 16px 14px;background:rgba(14,9,20,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.lbl{font-size:12px;color:var(--mute)}
#total{font-size:clamp(34px,9vw,54px);line-height:1;color:#fff;text-shadow:0 0 18px rgba(255,200,80,.5);font-variant-numeric:tabular-nums}
#verdict{font-size:clamp(16px,4.5vw,22px);padding:2px 12px;border-radius:99px}
#verdict.win{background:var(--win);color:#06301b}#verdict.mid{background:var(--gold);color:#3a2000}#verdict.lose{background:var(--lose);color:#0d1530}
.gauge{position:relative;height:14px;margin-top:12px;border-radius:99px;background:#2a1e33;overflow:visible}
#fill{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#5a7cff,#c86bff,#ff5fa8,#ffcf4a);box-shadow:0 0 14px rgba(255,170,90,.6)}
.mk{position:absolute;top:-6px;bottom:-6px;width:3px;background:#fff;border-radius:2px;opacity:.55}
.mk b{position:absolute;top:22px;left:50%;transform:translateX(-50%);font-size:11px;white-space:nowrap;color:var(--mute);font-weight:700}
.mk.on{opacity:1;box-shadow:0 0 12px #fff}.mk.on b{color:#fff}
#skip{position:absolute;right:14px;bottom:-40px;border:1px solid var(--line);background:rgba(26,18,32,.9);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:12px 10px;margin-top:52px}
@media(min-width:720px){.grid{grid-template-columns:repeat(auto-fill,minmax(112px,1fr))}}
.cd{perspective:700px}
.in{position:relative;aspect-ratio:63/88;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,1.35,.5,1)}
.skipping .in{transition-duration:.15s}
.cd.on .in{transform:rotateY(180deg)}
.bk,.fc{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:7px;overflow:hidden}
.bk{display:grid;place-items:center;border:2px solid var(--gold);background:radial-gradient(circle,#ffcf4a 0 13%,transparent 14%),repeating-conic-gradient(#b0182b 0 10deg,#7a0e1e 10deg 20deg)}
.bk span{font-family:"Dela Gothic One",sans-serif;font-size:13px;color:#3a0714}
.fc{transform:rotateY(180deg);background:var(--face);border:2px solid var(--rim)}
.gen{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:7px 6px;text-align:center}
.rb{align-self:center;font-size:10px;font-weight:900;padding:1px 7px;border-radius:99px;background:var(--rim);color:#120a18;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.nm{font-size:12px;font-weight:900;line-height:1.3;word-break:break-all;text-shadow:0 1px 2px #000}
.id{font-size:9px;color:rgba(255,255,255,.65)}
.fc img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:var(--face);opacity:0;transition:opacity .2s}
.fc img.ok,#reveal .card img.ok{opacity:1}
.pr{margin-top:6px;text-align:center;font-weight:900;font-size:13px;font-variant-numeric:tabular-nums;opacity:0;transition:opacity .3s .25s}
.cd.on .pr{opacity:1}
.k-R{--face:linear-gradient(160deg,#173a52,#0c1f2e);--rim:#7fd6e8}
.k-SR{--face:linear-gradient(160deg,#4a3410,#20160a);--rim:#ffcf4a}
.k-SEC{--face:linear-gradient(160deg,#5a1414,#250808);--rim:#ff7a5a}
.k-PAR{--face:linear-gradient(160deg,#3a1450,#14082a);--rim:#ff8fd0}
.k-LPAR{--face:linear-gradient(160deg,#104a3a,#082a20);--rim:#6cffc8}
.k-SP{--face:linear-gradient(160deg,#2a1a6a,#0e0830);--rim:#c3a8ff}
.k-TOP{--face:linear-gradient(160deg,#6a4a08,#2a1600);--rim:#ffe08a}
.k-PAR .fc::after,.k-LPAR .fc::after,.k-SP .fc::after,.k-TOP .fc::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,transparent 15%,rgba(255,110,200,.4),rgba(110,220,255,.4),rgba(255,240,130,.4),transparent 85%);background-size:260% 100%;mix-blend-mode:screen;animation:holo 2.2s linear infinite}
@keyframes holo{from{background-position:100% 0}to{background-position:-160% 0}}
/* 光彩は box-shadow で付ける(filter は3Dを平面化してめくりが壊れるため) */
.cd.on.g1 .fc{box-shadow:0 0 10px rgba(255,207,74,.75)}
.cd.on.g2 .fc{box-shadow:0 0 14px var(--rim),0 0 30px var(--rim)}
.cd.on.g3 .fc{box-shadow:0 0 20px #ffe08a,0 0 44px #ffb84a}
.cd.on.g2 .pr,.cd.on.g3 .pr{color:var(--gold);font-size:15px}
.cd.tease .in{animation:jit .09s linear infinite}
.cd.tease .bk{box-shadow:0 0 16px #fff,0 0 34px var(--rim)}
@keyframes jit{0%{translate:0 0}25%{translate:-2px 1px}50%{translate:2px -1px}75%{translate:-1px -2px}}
.pt{position:fixed;width:10px;height:10px;margin:-5px 0 0 -5px;z-index:70;pointer-events:none;border-radius:2px}
.toast{position:fixed;left:50%;top:32%;z-index:65;pointer-events:none;font-family:"Dela Gothic One",sans-serif;font-size:clamp(34px,10vw,64px);white-space:nowrap;opacity:0;transform:translate(-50%,-50%)}
.toast.m{color:#fff;text-shadow:0 0 20px #ff9d2e,0 4px 0 #8a2a0a}
.toast.p{color:var(--gold);text-shadow:0 0 30px #ff5fa8,0 5px 0 #8a2a0a}
.toast.go{animation:tst 1.5s ease-out}
@keyframes tst{0%{opacity:0;transform:translate(-50%,-50%) scale(2.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(.95)}25%{transform:translate(-50%,-50%) scale(1.05)}75%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1)}}
.stamp{position:fixed;left:50%;top:45%;z-index:66;transform:translate(-50%,-50%) rotate(-8deg);text-align:center;padding:14px 30px 12px;border:6px solid currentColor;border-radius:14px;background:rgba(10,6,16,.88);pointer-events:none}
.stamp b{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:clamp(46px,14vw,90px);line-height:1.05}
.stamp small{display:block;font-size:14px;color:var(--ink);font-weight:700;margin-top:4px}
.stamp.win{color:var(--win)}.stamp.mid{color:var(--gold)}.stamp.lose{color:var(--lose)}
.acts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:26px}
.btn{border:0;border-radius:12px;padding:15px 30px;font-family:"Dela Gothic One",sans-serif;font-size:18px;background:linear-gradient(180deg,#ffdd6a,#ff9d2e);color:#3a1500;box-shadow:0 5px 0 #8a3a0a,0 0 24px rgba(255,170,60,.45)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #8a3a0a}
.btn.s{background:transparent;color:var(--ink);border:1px solid var(--line);box-shadow:none;font-family:inherit;font-weight:700;font-size:14px;padding:11px 18px}
#tally{text-align:center;font-size:13px;color:var(--mute);margin-top:14px}
.panel{margin-top:16px;border:1px solid var(--line);border-radius:12px;padding:14px;background:var(--panel)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st .v{font-size:clamp(22px,6vw,30px);font-variant-numeric:tabular-nums}
.st small{display:block;color:var(--mute);font-size:12px}
.bar{display:grid;grid-template-columns:minmax(92px,36%) 1fr 52px;gap:8px;align-items:center;font-size:12px;margin:6px 0;font-variant-numeric:tabular-nums}
.bar i{display:block;height:12px;border-radius:3px;min-width:2px}
.small{font-size:12px;color:var(--mute)}
details{margin-top:14px;border:1px solid var(--line);border-radius:10px;padding:10px 14px;background:var(--panel)}
summary{cursor:pointer;font-weight:700;font-size:14px}
.set{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
.set label{display:block;font-size:12px;color:var(--mute)}
.set input,.set select{width:100%;font:inherit;color:var(--ink);background:#120c18;border:1px solid var(--line);border-radius:6px;padding:7px}
@media(max-width:560px){.set{grid-template-columns:1fr 1fr}}
ul.src{margin:8px 0 0;padding-left:18px;font-size:12px;color:var(--mute)}
/* カットイン */
#reveal{position:fixed;inset:0;z-index:55;border:0;width:100%;background:#05030a;display:grid;place-items:center;overflow:hidden;text-align:center}
#reveal .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,rgba(255,215,120,.32) 0 5deg,transparent 5deg 15deg);animation:spin 10s linear infinite}
#reveal.t2 .rays{background:repeating-conic-gradient(from 0deg,rgba(180,150,255,.32) 0 5deg,transparent 5deg 15deg)}
#reveal::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 46%,rgba(255,210,110,.6),transparent 55%)}
#reveal.t2::before{background:radial-gradient(circle at 50% 46%,rgba(170,140,255,.55),transparent 55%)}
#reveal .in2{position:relative;z-index:2;padding:20px;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both}
#reveal.t3 .in2{animation:pop .7s cubic-bezier(.2,1.4,.4,1) both,qk .45s .1s linear 3}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes qk{0%,100%{translate:0}25%{translate:-9px 4px}50%{translate:9px -4px}75%{translate:-5px -3px}}
#reveal .k{display:inline-block;font-family:"Dela Gothic One",sans-serif;font-size:clamp(18px,5vw,26px);padding:4px 18px;border-radius:99px;background:linear-gradient(90deg,#ffe08a,#ff9d2e);color:#2a1600}
#reveal.t2 .k{background:linear-gradient(90deg,#d8c8ff,#7aa8ff);color:#120a33}
#reveal .card{position:relative;margin:18px auto;width:min(58vw,240px);aspect-ratio:63/88;border-radius:12px;display:flex;align-items:center;justify-content:center;padding:14px;overflow:hidden;font-family:"Dela Gothic One",sans-serif;font-size:clamp(22px,6vw,30px);line-height:1.25;color:#1e1300;background:linear-gradient(150deg,#3a2a05,#a97a12 45%,#f6d775 52%,#8a600a);border:3px solid #ffe9a0;box-shadow:0 0 70px 16px rgba(255,210,100,.65)}
#reveal.t2 .card{color:#0f0a30;background:linear-gradient(150deg,#1a1448,#4d3fb0 45%,#b9a6ff 52%,#3a2d92);border-color:#d8ccff;box-shadow:0 0 70px 16px rgba(150,130,255,.6)}
#reveal .card img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .2s}
#reveal .pr2{font-family:"Dela Gothic One",sans-serif;font-size:clamp(32px,9vw,52px);color:#fff;text-shadow:0 0 24px rgba(255,200,80,.8)}
#reveal .hint{margin-top:8px;font-size:14px;color:#ddd;animation:pu 1.2s infinite}
@media(prefers-reduced-motion:reduce){#bg,.box,.box::after,.scene::after,.tap,#reveal .rays,.k-PAR .fc::after,.k-LPAR .fc::after,.k-SP .fc::after,.k-TOP .fc::after{animation:none}.in{transition:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<main>
<section id="stage">
<div>
<h1 class="ttl dg">OP17</h1>
<p class="sub dg">世界最強の戦士</p>
<div class="scene" id="scene"><button class="box" id="box" aria-label="BOXを開封する"><b class="dg">OP17</b><span>BOX</span></button></div>
<p class="tap dg">TAP!</p>
<p class="foot">非公式の開封シミュレーターです</p>
</div>
</section>

<section id="result" hidden>
<div class="hud">
<div class="row1"><div><div class="lbl">シングル価格の合計</div><div id="total" class="dg">¥0</div></div><div id="verdict" class="dg" hidden></div></div>
<div class="gauge"><div id="fill"></div><i class="mk" id="mkM"><b>定価</b></i><i class="mk" id="mkP"><b>プレ値</b></i></div>
<button id="skip">スキップ ▶▶</button>
</div>
<div id="grid" class="grid"></div>
<div id="after" hidden>
<div class="acts"><button class="btn" id="again">もう1BOX!</button><button class="btn s" id="more">くわしい数字</button></div>
<p id="tally"></p>
<div class="panel" id="detail" hidden>
<div class="two" id="stats"></div>
<p class="small" id="statNote"></p>
<div id="bars"></div>
<p class="small" id="warn" hidden></p>
</div>
</div>
<details><summary>条件・演出テスト</summary>
<div class="set">
<div><label for="msrp">定価(円)</label><input id="msrp" type="number" value="5760"></div>
<div><label for="pre">プレ値・実売(円)</label><input id="pre" type="number" value="7000"></div>
<div><label for="secBoxes">SEC通常(2種合計)</label><select id="secBoxes"><option value="2">2BOXに1枚</option><option value="3" selected>3BOXに1枚</option><option value="4">4BOXに1枚</option></select></div>
<div><label for="spN">SP10種(1種あたり)</label><select id="spN"><option value="90">90BOXに1枚</option><option value="105" selected>105BOXに1枚</option><option value="120">120BOXに1枚</option></select></div>
<div><label for="cpN">コミパラ(4種合計)</label><select id="cpN"><option value="72">72BOXに1枚</option><option value="96" selected>96BOXに1枚</option><option value="120">120BOXに1枚</option></select></div>
<div><label for="oN">海賊団SP(1枚あたり)</label><select id="oN"><option value="240" selected>240BOXに1枚</option><option value="500">500BOXに1枚</option></select></div>
</div>
<div class="acts" style="justify-content:flex-start;margin-top:12px"><button class="btn s" id="t3">テスト:海賊団SP</button><button class="btn s" id="t2">テスト:覇王色SP</button><button class="btn s" id="tc">テスト:コミパラ</button></div>
</details>
<details><summary>データの根拠</summary><ul class="src" id="src"></ul></details>
<p class="small" style="margin-top:16px">ショップのシングル販売価格(R以上)の合計です。C・UCと、売却時の手数料は含みません。封入率は販売サイトの推定値で、公式発表はありません。価格データの一部:楽天ウェブサービス / Supported by Rakuten Developers / <a href="https://developer.yahoo.co.jp/sitemap/" style="color:inherit">Web Services by Yahoo! JAPAN</a></p>
</section>
</main>

<button id="reveal" hidden aria-label="次へ"><div class="rays"></div><div class="in2"><div class="k" id="rk"></div><div class="card" id="rcard"><span id="rn"></span><div id="rimg"></div></div><div class="pr2" id="rp"></div><div class="hint">タップ</div></div></button>
<div id="toast" class="toast"></div>
<div id="stampEl" class="stamp" hidden></div>
<div id="flash"></div>

<script>
var S={msrp:5760,pre:7000,spN:105,secBoxes:3,oN:240,cpN:96,date:'2026-10-20'};
var $=function(i){return document.getElementById(i)};
var yen=function(v){return(v<0?'−':'')+'¥'+Math.abs(Math.round(v)).toLocaleString('ja-JP')};
var sgn=function(v){return(v>=0?'+':'')+yen(v)};
var reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
var busy=false,skip=false,hits=[],tally={n:0,w:0,pnl:0},cur=0;
// 価格pは販売価格。nullは未取得(0円扱い)。tは演出ランク(3=海賊団SP等 / 2=SP10種)
function mk(s,sfx,k,c,only){return s.split(',').map(function(x){var a=x.split(':');return{id:'OP17-'+a[0]+sfx,n:a[1],k:k,c:c,p:null,t:0}}).filter(function(o){return !only||only.indexOf(o.id.slice(5,8))>=0})}
function o(id,n,k,c,p,t){return{id:id,n:n,k:k,c:c,p:p,t:t}}

function Bitems(){var a=[];

function drawer(){
 var B=Bitems(),pB=0;B.forEach(function(x){pB+=x[1]});
 var pS=1/S.secBoxes,cond=Math.min(1,pB/(1-pS));
 return function(force){
  var h=[],i,n=7+(Math.random()<.5?1:0),m=3+(Math.random()<.3?1:0);
  for(i=0;i<n;i++)h.push(pick(POOL.R));

  if(Math.random()<pS)h.push(pick(POOL.SECN));
  else{h.push(pick(POOL.PAR));
   if(Math.random()<cond){var u=Math.random()*pB,j=0;while(j<B.length-1&&u>=B[j][1]){u-=B[j][1];j++}h.push(B[j][0])}}
  if(force){var f=ALL.filter(function(c){return c.id===force})[0];if(f&&h.indexOf(f)<0)h.push(f)}
  return h}
}
